<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Q&A</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .question { border: 1px solid #ddd; padding: 1rem; margin-bottom: 1rem; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;}
        button { cursor: pointer; padding: 0.5rem 1rem; background: #f5f5f5; color: #111; border: 1px solid #ddd; border-radius: 4px; }
        form { display: flex; gap: 1rem; margin-bottom: 2rem; }
        input { padding: 0.5rem; flex: 1; border: 1px solid #ddd; border-radius: 4px; }
        ul { list-style: none; padding: 0; }
    </style>
</head>

<body>
    <h2>Live Q&A</h2>

    <form onsubmit="event.preventDefault(); askQuestion()">
        <input id="qInput" placeholder="Ask a question..." size="30">
        <button>Submit</button>
        <button type="button" onclick="loadQuestions()">Refresh</button>
    </form>

    <ul id="board">Loading questions...</ul>

    <script>
        const API_URL = 'http://localhost:8000';

        async function loadQuestions() {
            const res = await fetch(`${API_URL}/questions`);
            const questions = await res.json();

            document.getElementById('board').innerHTML = questions.map(q => `
                <li class="question">
                    ${q.text}
                    <button onclick="upvote(${q.id})">👍 ${q.upvotes}</button>
                </li>
            `).join('');
        }

        async function askQuestion() {
            const input = document.getElementById('qInput');
            if (!input.value) return;

            await fetch(`${API_URL}/questions`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: input.value })
            });

            input.value = '';
            loadQuestions();
        }

        async function upvote(id) {
            await fetch(`${API_URL}/questions/${id}/upvote`, { method: 'PATCH' });
            loadQuestions();
        }

        loadQuestions();
    </script>
</body>

</html>
